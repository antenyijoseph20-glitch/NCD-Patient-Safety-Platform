[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "ncd-patient-safety-platform"
version = "0.1.0"
description = "NCD Patient Safety Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.18,<3.19",
    "drf-spectacular>=0.30,<0.31",
    "psycopg[binary]>=3.3,<3.4",
    "celery>=5.6,<5.7",
    "redis>=8,<9",
    "django-environ>=0.13,<0.14",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "*/migrations/*",
    "staticfiles",
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501", # Line length (handled by ruff format)
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
